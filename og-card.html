<!doctype html>
<!-- Source for og-image.png (the link preview in Messages, Slack, email).
     Re-render with:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --hide-scrollbars \
       --window-size=1200,630 --virtual-time-budget=8000 --screenshot=og-image.png og-card.html -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Red+Hat+Mono:wght@600&family=Red+Hat+Text:wght@500&display=block">
<style>
  :root { --asphalt: #1c1f22; --fog: #a9afb5; --mark: #e4002b; --vest: #f2c230; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: var(--asphalt); color: #fff; position: relative; font-family: "Red Hat Text", sans-serif; }
  .photo { position: absolute; right: 0; top: 0; bottom: 0; width: 440px; background: url("https://static.wixstatic.com/media/f25b36_60762058973d4aa3aef46ebb24321bf8~mv2.jpg/v1/fill/w_900,h_1300,q_85/p.jpg") center / cover; }
  .photo::before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, var(--asphalt) 0%, rgb(28 31 34 / 0.2) 40%, rgb(28 31 34 / 0) 100%); }
  .logo { position: absolute; left: 68px; top: 54px; background: #fff; padding: 12px 16px; border-radius: 3px; }
  .logo img { display: block; width: 250px; height: auto; }
  .concept { position: absolute; right: 30px; top: 30px; background: var(--vest); color: #15171a; padding: 8px 12px; font: 600 15px/1 "Red Hat Mono", monospace; letter-spacing: 0.04em; text-transform: uppercase; }
  h1 { position: absolute; left: 68px; top: 190px; margin: 0; width: 720px; font: 850 100px/0.9 "Archivo", sans-serif; font-stretch: 72%; text-transform: uppercase; letter-spacing: -0.01em; }
  h1 .paint { position: relative; display: inline-block; }
  h1 .paint svg { position: absolute; left: -2%; bottom: -14px; width: 104%; height: 30px; overflow: visible; }
  .doors { position: absolute; left: 68px; bottom: 58px; display: flex; gap: 28px; font: 600 17px/1 "Red Hat Mono", monospace; letter-spacing: 0.06em; text-transform: uppercase; color: var(--fog); }
  .doors span::before { content: ""; display: inline-block; width: 16px; height: 4px; background: var(--mark); margin-right: 10px; vertical-align: middle; }
  .where { position: absolute; left: 68px; bottom: 96px; font-size: 24px; color: #fff; }
  .where b { color: var(--mark); font-weight: 500; }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute"><defs>
    <filter id="spray" x="-5%" y="-40%" width="110%" height="180%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3" result="d"/><feGaussianBlur in="d" stdDeviation="0.5"/></filter>
    <filter id="overspray"><feGaussianBlur stdDeviation="3"/></filter>
  </defs></svg>
  <div class="photo"></div>
  <div class="concept">Design concept</div>
  <div class="logo"><img src="https://static.wixstatic.com/media/f25b36_3a04e9cab7564cf59a3a5d3c6f41f4ba~mv2.jpg/v1/fit/w_600,h_150,q_90/logo.jpg" alt=""></div>
  <h1>Mid-Atlantic electricians <span class="paint">since 1970<svg viewBox="0 0 400 30" preserveAspectRatio="none">
    <path d="M4 18 C 90 8, 210 26, 396 12" stroke="#e4002b" stroke-width="14" fill="none" stroke-linecap="round" filter="url(#overspray)" opacity="0.35"/>
    <path d="M4 18 C 90 8, 210 26, 396 12" stroke="#e4002b" stroke-width="9" fill="none" stroke-linecap="round" filter="url(#spray)"/>
  </svg></span></h1>
  <p class="where" style="margin:0">Maryland · Washington DC · Northern Virginia <b>· 24/7 service</b></p>
  <div class="doors"><span>Service</span><span>Construction</span><span>Underground utilities</span></div>
</body>
</html>
